<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Stack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        h1 { color: #00d4ff; }
        a { color: #00d4ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .links { margin-top: 30px; }
        .links a {
            display: block;
            margin: 10px 0;
            padding: 12px 20px;
            background: #16213e;
            border: 1px solid #00d4ff;
            border-radius: 6px;
        }
        .links a:hover { background: #1a1a4e; }
    </style>
</head>
<body>
    <h1>Prometheus + Grafana</h1>
    <p>Nginx is running and being monitored.</p>
    <div class="links">
        <a href="http://localhost:3000">Grafana Dashboard</a>
        <a href="http://localhost:9090">Prometheus</a>
        <a href="http://localhost:80/stub_status">Nginx Stub Status</a>
    </div>
</body>
</html>
