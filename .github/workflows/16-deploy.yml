name: Deploy Dockerized Service (Project 16)

on:
  push:
    branches:
      - main
    paths:
      - '16-dockerized-service/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dockerized-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./16-dockerized-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROJECT16_EC2_HOST }}
          username: ${{ secrets.PROJECT16_EC2_USERNAME }}
          key: ${{ secrets.PROJECT16_SSH_PRIVATE_KEY }}
          script: |
            # Stop existing container
            docker stop dockerized-service || true
            docker rm dockerized-service || true

            # Pull and run new image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            docker run -d \
              --name dockerized-service \
              --restart unless-stopped \
              -p 3000:3000 \
              -e SECRET_MESSAGE="${{ secrets.PROJECT16_SECRET_MESSAGE }}" \
              -e USERNAME="${{ secrets.PROJECT16_USERNAME }}" \
              -e PASSWORD="${{ secrets.PROJECT16_PASSWORD }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
